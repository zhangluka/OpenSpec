name: lean-sdd
version: 1
description: 精益 SDD 工作流 - 需求澄清 → spec规范 → 详细设计 → 任务
artifacts:
  - id: requirement
    generates: requirement.md
    description: 需求澄清说明书（对标传统开发流程中的需求澄清说明书）— 将模糊需求转化为无歧义、可验证的功能规格
    template: requirement.md
    instruction: |
      根据用户提供的输入（自然语言描述、Markdown 需求文档或 Word 格式说明书），
      输出一份「需求澄清说明书」。
      本文档对标传统开发流程中的「需求澄清说明书」角色。

      核心原则：
      - 只定义「做什么」和「为什么」，不涉及「怎么做」
      - 将模糊表述转化为无歧义、可验证的功能规格
      - 每条需求必须附带可验证的验收标准

      输入处理：
      - 若输入是一段自然语言描述，提取其中的需求要点并结构化
      - 若输入是需求文档（Markdown/Word），解析其内容并补全缺失的验收标准
      - 若输入含歧义或矛盾，在「待澄清项」中明确列出

      章节：
      - **概述**：用 2～3 句话概括需求的目标与背景。这个变更要解决什么问题？为什么需要？
      - **功能需求**：逐条列出功能需求，每条需求包含：
        - 需求描述（使用 SHALL/MUST，避免 should/may）
        - 验收标准（具体、可测量、无歧义的 WHEN/THEN 条件）
      - **非功能需求**（如适用）：性能、安全、兼容性等约束
      - **边界与排除**：明确不在本次范围内的内容
      - **术语定义**（如适用）：对领域术语给出精确定义，消除理解偏差
      - **待澄清项**：输入中发现的歧义、矛盾或信息缺失，需用户进一步确认

      质量检查：
      - 每条功能需求是否有对应的验收标准？
      - 是否存在「大概」「尽量」「适当」等模糊词？若有，转化为具体指标
      - 是否混入了实现细节（如「用 Redis 缓存」）？若有，剥离到备注

      这是整个工作流的基础——后续规范、设计和任务都建立在此之上。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 本变更的详细规范
    template: spec.md
    instruction: |
      请用中文撰写需求与场景的正文（标题与格式保持英文，如 Requirement/Scenario/WHEN/THEN）。

      创建定义「系统应做什么」的规范文件。

      按提案中「能力」一节列出的每项能力各写一个规范文件。
      - 新增能力：使用提案中的 kebab-case 名称（specs/<capability>/spec.md）。
      - 修改的能力：使用 phspec/specs/<capability>/ 下已有规范目录名，在变更目录下创建增量规范 specs/<capability>/spec.md。

      增量操作（使用 ## 标题）：
      - **ADDED Requirements**：新增能力
      - **MODIFIED Requirements**：行为变更——必须包含完整更新后的内容
      - **REMOVED Requirements**：废弃项——必须包含 **Reason** 与 **Migration**
      - **RENAMED Requirements**：仅名称变更——使用 FROM:/TO: 格式

      需求格式：
      - 每条需求：`### Requirement: <name>` 后跟描述
      - 规范性需求使用 SHALL/MUST（避免 should/may）
      - 每个场景：`#### Scenario: <name>`，采用 WHEN/THEN 格式
      - **关键**：场景必须使用恰好 4 个井号（`####`）。使用 3 个井号或列表会导致静默失败。
      - 每条需求至少有一个场景。

      MODIFIED 需求的操作步骤：
      1. 在 phspec/specs/<capability>/spec.md 中找到现有需求
      2. 复制整条需求块（从 `### Requirement:` 到其下所有场景）
      3. 粘贴到 `## MODIFIED Requirements` 下并修改为新行为
      4. 确保标题文字完全匹配（忽略首尾空白）

      常见错误：MODIFIED 只写部分内容会在归档时丢失细节。
      若只新增关注点而不改既有行为，请使用 ADDED。

      示例：
      ```
      ## ADDED Requirements

      ### Requirement: 用户可导出数据
      系统 SHALL 允许用户以 CSV 格式导出其数据。

      #### Scenario: 导出成功
      - **WHEN** 用户点击「导出」按钮
      - **THEN** 系统下载包含全部用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **Reason**: 已由新导出系统替代
      **Migration**: 使用新导出接口 /api/v2/export
      ```

      规范应可检验——每个场景都是潜在测试用例。
    requires:
      - requirement

  - id: plan
    generates: plan.md
    description: 详细设计说明书 — 阐述需求的实现方案与模块划分，面向 BA、测试及开发团队的设计沟通文档
    template: plan.md
    instruction: |
      基于 requirement.md 中的业务需求，输出一份「详细设计说明书」(plan.md)。

      核心定位：
      - 开发者撰写，面向 BA、测试、其他开发阐述「我打算怎么实现这些需求」
      - 聚焦业务模块划分与职责、模块间协作关系、影响范围分析
      - 不包含代码级细节（函数签名、数据结构字段等留给 tasks 阶段）
      - 不做技术选型说明，遵循项目既有技术规范即可
      - 不使用 MUST/SHALL 等规范性表述（那是 specs 的职责）

      组织方式：
      - 先充分理解 requirement.md 中的每条需求，梳理需求之间的关系
      - 按业务需求或业务模块进行分类划分（按业务领域组织，而非按技术层组织）
      - 每个需求/模块下按需拆分为子功能或子模块，形成层次化的树形结构
      - 结构示例：
        ```
        ## 模块设计
        ### 用户管理
          #### 用户注册
          #### 用户认证
        ### 数据导出
          #### CSV 导出
          #### 批量导出
        ```

      章节：

      - **设计概述**：用 3～5 句话概括实现思路。涉及哪些模块？整体改动方向是什么？
      - **模块设计**：按业务需求/模块分节，每个模块下按需拆分子功能/子模块。每个模块或子模块说明：
        - 职责：该模块的业务职责
        - 改动内容：本次需要新增或修改什么
        - 协作关系：与哪些模块交互，如何协作
        - 所在目录：模块对应的项目目录路径
      - **影响范围分析**：本次变更对现有功能/模块的影响，需要回归测试的区域
      - **数据流说明**（如适用）：关键业务流程的数据流转路径。若无复杂数据流可省略此节
      - **风险与对策**：已知风险及缓解方案
      - **待确认事项**：需与 BA、测试或其他开发讨论确认的问题

      写作原则：
      - 用通俗易懂的语言，确保非开发角色也能理解设计意图
      - 粒度到业务模块/目录级别，不深入代码实现细节
      - 不重复 requirement.md 中已有的业务描述，聚焦「怎么做」
      - 不重复项目已有的技术栈/框架约定
      - 适当使用 Mermaid 图表辅助表达（如流程图、时序图、模块交互图等），让设计意图更直观
    requires:
      - requirement

  - id: tasks
    generates: tasks.md
    description: 任务拆解清单 — 可执行、可验证、可并行的最小任务单元，含红绿测试验证
    template: tasks.md
    instruction: |
      基于 plan.md（详细设计说明书）拆解为任务清单。

      **重要：请严格按下列格式书写。** 应用阶段会解析勾选格式以跟踪进度，未使用 `- [ ]` 的任务不会被跟踪。

      拆解原则：
      - 最小任务单元：每个任务应是单一职责、可独立完成的最小工作单元
      - 可执行：任务描述足够具体，AI 或开发者无需额外信息即可开始
      - 可验证：每个任务附带红绿测试（成功案例 + 失败案例），完成即可判定
      - 可并行：标注任务间依赖关系，无依赖的任务可并行执行
      - 单文件优先：一个任务尽量只涉及一个文件的创建或修改；若需跨文件则拆分为多个任务
      - 规模检查：若一个任务的伪代码超过 30 行，应考虑进一步拆分

      任务格式：
      - 在 `## 编号. 任务组名称` 下分组相关任务
      - 每条任务：`- [ ] X.Y 任务描述`
      - 每条任务下方包含：
        - **涉及文件**：该任务需创建或修改的文件路径（防止 AI 发散到无关文件）
        - **输入/输出**：明确该任务的前置条件与交付物
        - **上下文参考**（如适用）：指向项目中可参考的既有代码、模式或工具函数，提高实现一致性
        - **伪代码**（必要时）：关键逻辑的伪代码级描述，降低实现歧义
        - **红绿测试**：
          - 🟢 成功案例：正常路径的验证条件（WHEN → THEN）
          - 🔴 失败案例：异常/边界情况的验证条件（WHEN → THEN）
        - **验证方式**：指定测试类型（单元测试 / 集成测试 / E2E / 手动验证）
        - **依赖**：依赖的前置任务编号（如无则标注「无」）

      示例：
      ```
      ## 1. 数据层

      - [ ] 1.1 实现用户数据导出函数
        - **涉及文件**：src/services/export.ts（新建）
        - **输入**：用户 ID
        - **输出**：CSV 格式字符串
        - **上下文参考**：参考 src/services/import.ts 中的 importUserData 实现模式
        - **伪代码**：
          ```
          function exportUserData(userId):
            user = db.findById(userId)
            if not user: throw NotFoundError
            records = db.queryRecords(userId)
            return formatCSV(records)
          ```
        - **红绿测试**：
          - 🟢 WHEN 有效用户 ID → THEN 返回包含全部记录的 CSV
          - 🟢 WHEN 用户无记录 → THEN 返回仅含表头的空 CSV
          - 🔴 WHEN 无效用户 ID → THEN 抛出 NotFoundError
          - 🔴 WHEN 数据库连接失败 → THEN 抛出 ConnectionError
        - **验证方式**：单元测试
        - **依赖**：无

      - [ ] 1.2 添加 CSV 格式化工具
        - **涉及文件**：src/utils/csv.ts（新建）
        - **输入**：记录数组
        - **输出**：符合 RFC 4180 的 CSV 字符串
        - **上下文参考**：参考 src/utils/json.ts 中的工具函数风格
        - **红绿测试**：
          - 🟢 WHEN 正常数据 → THEN 输出合法 CSV
          - 🔴 WHEN 字段含逗号/换行 → THEN 正确转义
        - **验证方式**：单元测试
        - **依赖**：无（可与 1.1 并行）

      ## 2. API 层

      - [ ] 2.1 添加导出 API 端点
        - **涉及文件**：src/routes/export.ts（新建）、src/routes/index.ts（修改）
        - **依赖**：1.1, 1.2
        - **验证方式**：集成测试
      ```

      做什么参考 requirement.md，怎么做参考 plan.md。
      对简单任务可省略伪代码和上下文参考，但涉及文件、红绿测试和验证方式不可省略。
    requires:
      - specs
      - plan

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    阅读上下文文件（requirement.md、plan.md、tasks.md），按顺序处理未完成任务。

    实施原则：

    1. **遵守项目规范与编码规范**
       - 遵循项目已有的代码风格、命名约定、目录结构
       - 遵守 context 中声明的技术栈约束与编码规范
       - 新增代码应与既有代码库保持一致

    2. **以规格为准绳校验实现**
       - 每完成一个任务，对照 requirement.md 中对应的功能需求与验收标准进行自检
       - 执行 tasks.md 中的红绿测试：确保 🟢 成功案例通过、🔴 失败案例按预期处理
       - 实现不得偏离 plan.md 中的模块设计与协作关系

    3. **以规格为唯一依据完成验收**
       - 任务完成的判定标准：requirement.md 中的验收标准全部满足
       - tasks.md 中的红绿测试全部通过
       - 不引入规格之外的额外功能（避免范围蔓延）

    工作流程：
    - 按 tasks.md 中的任务顺序逐条实施
    - 每完成一条任务：实现 → 自检（对照规格）→ 勾选 `- [x]`
    - 若实现过程中发现规格有歧义或缺失，暂停并提出澄清
    - 若遇阻塞或需要变更规格，先暂停，不要自行假设
